name: Test e2e for PR

on:
  pull_request:

jobs:
  check-changed-files:
    runs-on: ubuntu-latest
    name: Check changed files
    permissions:
      contents: read
    outputs:
      NEED_TO_RUN_TESTS: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: changes
        uses: fingerprintjs/dx-team-toolkit/.github/actions/paths-changed@main
        with:
          paths: |
            src/**
            plugins/**
            .github/workflows/**
      - name: Print decision
        run: |
          echo "NEED_TO_RUN_TESTS=${{ steps.changes.outputs.changed }}"
  build-and-test-e2e-mock:
    runs-on: ubuntu-latest
    name: Test e2e for PR using mock app
    needs: check-changed-files
    if: needs['check-changed-files'].outputs.NEED_TO_RUN_TESTS == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: 'Install pnpm'
        uses: pnpm/action-setup@129abb77bf5884e578fcaf1f37628e41622cc371
        with:
          cache: 'pnpm'
          version: 8
      - name: Install node
        uses: actions/setup-node@v3
        with:
          node-version-file: '.node-version'
      - name: Install dependencies
        run: pnpm install
      - name: Extract Branch Name
        id: extract-branch
        run: |
          branch=$(echo ${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}} | perl -pe 's/[^a-zA-Z0-9]+/-/g and s/-+$//g' | tr '[:upper:]' '[:lower:]')
          hash=$(echo "$branch" | cksum | awk '{printf "%08x", $1}')
          truncated=$(echo "$branch" | cut -c1-37 | sed 's/-$//')
          echo SUBDOMAIN=mock-${truncated}-${hash} >> $GITHUB_OUTPUT
      - name: Set up Fastly CLI
        uses: fastly/compute-actions/setup@v8
      - name: Package Fastly WASM File
        uses: fastly/compute-actions/build@v8
        with:
          verbose: true
        env:
          STORE_NAME_PREFIX: "E2ETest"
      - name: Deploy
        id: deploy
        env:
          SERVICE_NAME: "${{steps.extract-branch.outputs.SUBDOMAIN}}.${{secrets.FPJS_CI_DOMAIN}}"
          DEFAULT_ORIGIN: ${{secrets.DEFAULT_ORIGIN}}
          FASTLY_API_TOKEN: ${{secrets.FASTLY_API_TOKEN}}
          FPJS_BACKEND_URL: ${{secrets.MOCK_WARDEN_DOMAIN}}
          STORE_NAME_PREFIX: "E2ETest"
        run: pnpm run ci
      - name: Wait for 60s
        shell: bash
        run: sleep 60s
      - name: Run test
        run: pnpm test:mock-e2e
        env:
          MOCK_WARDEN_DOMAIN: ${{secrets.MOCK_WARDEN_DOMAIN}}
          MOCK_API_URL: 'https://fpjs-fastly-${{steps.extract-branch.outputs.SUBDOMAIN}}.edgecompute.app'
          MOCK_RESULT_PATH: ${{secrets.MOCK_RESULT_PATH}}
          MOCK_AGENT_PATH: ${{secrets.MOCK_AGENT_PATH}}

name: Daily E2E Test

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  set_datadog_team:
    name: 'Set Datadog team'
    uses: fingerprintjs/dx-team-toolkit/.github/workflows/set-datadog-team.yml@v1
    secrets:
      DD_API_KEY: ${{ secrets.INTEGRATIONS_DATADOG_API_KEY }}

  build-and-test-e2e-mock:
    name: Test e2e using mock app
    uses: ./.github/workflows/mock-e2e.yml
    # The URL is built from a secret, and the `secrets` context is unavailable in `with:`,
    # so it is passed through the INTEGRATION_URL secret instead.
    secrets:
      INTEGRATION_URL: 'https://${{ secrets.FPJS_FASTLY_MOCK_TEST_DOMAIN }}'
      MOCK_WARDEN_DOMAIN: ${{ secrets.MOCK_WARDEN_DOMAIN }}
      MOCK_RESULT_PATH: ${{ secrets.MOCK_RESULT_PATH }}
      MOCK_AGENT_PATH: ${{ secrets.MOCK_AGENT_PATH }}
